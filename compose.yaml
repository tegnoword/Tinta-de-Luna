services:
  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - POSTGRES_HOST=tu_db_host_de_render
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mi_base_datos
      - POSTGRES_USERNAME=mi_usuario
      - POSTGRES_PASSWORD=mi_password